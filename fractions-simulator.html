<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dr. A.P.J. Abdul Kalam Inter College - Fractions Visualizer. Learn mathematics interactively." />
  <title>Fractions Visualizer | Dr. A.P.J. Abdul Kalam Inter College</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    body { background: #f8fbff; color: var(--navy); overflow: auto ; }
    .sim-header { padding: 40px 24px 40px; text-align: center; position: relative; z-index: 10; background: var(--navy); color: white; }
    .sim-header h1 { font-size: 2.5rem; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .sim-header p { color: rgba(255,255,255,0.8); max-width: 600px; margin: 10px auto; }
    .back-btn { position: absolute; top: 70px; left: 24px; background: rgba(255,255,255,0.1); color: white; padding: 8px 16px; border-radius: 50px; text-decoration: none; font-size: 0.9rem; transition: all 0.3s ease; backdrop-filter: blur(5px); }
    .back-btn:hover { background: var(--saffron); color: white; }
    .sim-app-container { max-width: 1200px; margin: 40px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 350px; gap: 30px; align-items: start; }
    .sim-viewer { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px; text-align: center; }
    canvas { width: 100%; max-width: 600px; height: auto; background: #fafcff; border-radius: var(--radius-md); }
    .sim-panel { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 25px; }
    .sim-panel h3 { font-size: 1.25rem; color: var(--navy); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid rgba(13,27,42,0.1); padding-bottom: 10px; }
    .sim-panel h3 i { color: var(--saffron); }
    .control-group { margin-bottom: 20px; }
    .control-group label { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
    .control-group label span.value { color: var(--saffron); font-size: 1.1rem; }
    .control-group input[type="range"] { width: 100%; accent-color: var(--saffron); }
    .readout-box { background: #f1f5fa; border-radius: var(--radius-md); padding: 15px; margin-top: 30px; }
    .readout-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1.1rem; border-bottom: 1px dashed rgba(0,0,0,0.1); padding-bottom: 8px; font-weight: 600; }
    .readout-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .readout-item span.res-val { color: #E65100; }
    .toggle-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .toggle-btn { flex: 1; padding: 10px; border: 1px solid #e0e6ed; background: #f8fbff; color: var(--text-medium); font-weight: 600; border-radius: var(--radius-md); cursor: pointer; transition: all 0.3s; }
    .toggle-btn.active { background: var(--navy); color: white; border-color: var(--navy); box-shadow: 0 4px 10px rgba(13,27,42,0.2); }
    @media (max-width: 900px) { .sim-app-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- <div id="header-placeholder"></div> -->

  <header class="sim-header">
    <a href="study.html" class="back-btn"><i class="fas fa-arrow-left"></i> <span data-i18n="back-study">Back to Study Hub</span></a>
    <h1 data-i18n="study-fractions-title">Fractions Visualizer</h1>
    <p data-i18n="study-fractions-desc">Interactive tool to visually understand fractions, decimals, and percentages.</p>
  </header>

  <section class="sim-app-container">
    <div class="sim-viewer">
      <canvas id="frac-canvas" width="600" height="700"></canvas>
    </div>

    <div class="sim-panel">
      <h3 data-i18n="frac-controls"><i class="fas fa-chart-pie"></i> Fraction Controls</h3>
      
      <div class="toggle-group">
        <button class="toggle-btn active" id="btn-pie" data-i18n="frac-pie">Pie Chart</button>
        <button class="toggle-btn" id="btn-bar" data-i18n="frac-bar">Bar Chart</button>
      </div>

      <div class="control-group">
        <label><span data-i18n="frac-num">Numerator (Top)</span> <span class="value" id="val-num">3</span></label>
        <input type="range" id="range-num" min="0" max="200" value="3" step="1">
      </div>

      <div class="control-group">
        <label><span data-i18n="frac-den">Denominator (Bottom)</span> <span class="value" id="val-den">8</span></label>
        <input type="range" id="range-den" min="1" max="200" value="8" step="1">
      </div>

      <div class="readout-box">
        <h3 data-i18n="frac-results" style="border-bottom:none; margin-bottom:10px;"><i class="fas fa-equals"></i> Equivalents</h3>
        <div class="readout-item"><span data-i18n="frac-decimal">Decimal</span> <span class="res-val" id="res-dec">0.375</span></div>
        <div class="readout-item"><span data-i18n="frac-percent">Percentage</span> <span class="res-val" id="res-per">37.5%</span></div>
      </div>
    </div>
  </section>

  <!-- <div id="footer-placeholder"></div> -->
  <script src="js/translations.js"></script>
  <script src="js/main.js"></script>
  <script src="js/fractions-simulator.js"></script>
  <div id="zoom-controls-placeholder"></div>
  <div id="scrollbar-placeholder"></div>
</body>
</html>
