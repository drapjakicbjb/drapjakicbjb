<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dr. A.P.J. Abdul Kalam Inter College - Interactive Animal Cell. Learn biology interactively." />
  <title>Interactive Animal Cell | Dr. A.P.J. Abdul Kalam Inter College</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    body { background: #e8f5e9; color: var(--navy); overflow-x: hidden; }
    .sim-header { padding: 30px 24px 40px; text-align: center; position: relative; z-index: 10; background: #2e7d32; color: white; }
    .sim-header h1 { font-size: 2.5rem; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .sim-header p { color: rgba(255,255,255,0.9); max-width: 600px; margin: 10px auto; }
    .back-btn { position: absolute; top: 70px; left: 24px; background: rgba(255,255,255,0.1); color: white; padding: 8px 16px; border-radius: 50px; text-decoration: none; font-size: 0.9rem; transition: all 0.3s ease; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.3); }
    .back-btn:hover { background: white; color: #2e7d32; }
    .sim-app-container { max-width: 1200px; margin: 40px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 350px; gap: 30px; align-items: start; }
    .sim-viewer { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px; text-align: center; }
    canvas { width: 100%; max-width: 600px; height: auto; background: #fafcff; border-radius: var(--radius-md); cursor: crosshair; }
    .sim-panel { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 25px; }
    .sim-panel h3 { font-size: 1.25rem; color: #2e7d32; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid rgba(46,125,50,0.1); padding-bottom: 10px; }
    .info-box { background: #f1f8e9; border-radius: var(--radius-md); padding: 20px; border-left: 4px solid #2e7d32; min-height: 200px; }
    .info-title { font-size: 1.4rem; font-weight: 700; color: #1b5e20; margin-bottom: 10px; }
    .info-desc { font-size: 1rem; color: #333; line-height: 1.6; }
    
    .toggle-group { display: flex; background: #e8f5e9; border-radius: 50px; padding: 5px; margin-bottom: 25px; }
    .toggle-btn { flex: 1; padding: 10px 15px; border: none; background: transparent; color: #2e7d32; font-weight: 600; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-family: 'Poppins', sans-serif; font-size: 0.95rem; }
    .toggle-btn:hover { background: rgba(46,125,50,0.1); }
    .toggle-btn.active { background: #2e7d32; color: white; box-shadow: 0 4px 10px rgba(46,125,50,0.3); }
    
    @media (max-width: 900px) { .sim-app-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- <div id="header-placeholder"></div> -->

  <header class="sim-header">
    <a href="study.html" class="back-btn"><i class="fas fa-arrow-left"></i> <span data-i18n="back-study">Back to Study Hub</span></a>
    <h1 data-i18n="bio-title">Interactive Animal Cell</h1>
    <p data-i18n="bio-desc">Hover over and click organelles to learn about their functions.</p>
  </header>

  <section class="sim-app-container">
    <div class="sim-viewer">
      <canvas id="bio-canvas" width="600" height="600"></canvas>
    </div>

    <div class="sim-panel">
      <h3 data-i18n="bio-controls" style="border-bottom:none; padding-bottom:5px; margin-bottom:10px;"><i class="fas fa-sliders"></i> Cell Type</h3>
      <div class="toggle-group" style="margin-bottom: 25px;">
        <button class="toggle-btn active" id="btn-animal" data-i18n="bio-type-animal">Animal Cell</button>
        <button class="toggle-btn" id="btn-plant" data-i18n="bio-type-plant">Plant Cell</button>
      </div>

      <h3 data-i18n="bio-organelle"><i class="fas fa-microscope"></i> Organelle Information</h3>
      
      <div class="info-box">
        <div class="info-title" id="info-title" data-i18n="bio-select">Select an Organelle</div>
        <div class="info-desc" id="info-desc" data-i18n="bio-select-desc">Click on parts of the cell diagram to view details here.</div>
      </div>
    </div>
  </section>

  <!-- <div id="footer-placeholder"></div> -->
  <script src="js/translations.js"></script>
  <script src="js/main.js"></script>
  <script src="js/biology-cell.js"></script>
</body>
</html>
