<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--saffron:#FF6B00;--saffron-light:#FF8C42;--green:#2E7D32;--dark-blue:#0D1B2A;--navy:#1A2744;--white:#FFF;--off-white:#F8FAFF;--text-dark:#1A202C;--gradient-hero:linear-gradient(135deg,#FF6B00 0%,#FF8C42 30%,#7CB342 70%,#2E7D32 100%);--gradient-saffron:linear-gradient(135deg,#FF6B00,#FF8C42);--shadow-sm:0 2px 8px rgba(0,0,0,.08);--radius-sm:8px;--radius-md:16px;--radius-lg:24px;--transition:all .3s cubic-bezier(.4,0,.2,1)}
html{scroll-behavior:smooth;font-size:16px;overflow-x:hidden;width:100%;overflow-anchor:none}
body{font-family:'Poppins',sans-serif;color:var(--text-dark);background:var(--white);line-height:1.6;overflow-x:hidden;width:100%;position:relative}
img{max-width:100%;height:auto;display:block}a{text-decoration:none;color:inherit}ul{list-style:none}
#loader{position:fixed;inset:0;background:var(--dark-blue);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;transition:opacity .6s ease,visibility .6s ease}
#loader.hidden{opacity:0;visibility:hidden}
.loader-logo{width:130px;height:130px;border-radius:50%;object-fit:cover;animation:loaderPulse 1.5s ease-in-out infinite;box-shadow:0 0 40px rgba(255,107,0,.5)}
.loader-text{color:#fff;font-size:.85rem;letter-spacing:3px;margin-top:20px;text-transform:uppercase;opacity:.8}
.loader-bar{width:200px;height:3px;background:rgba(255,255,255,.2);border-radius:10px;margin-top:16px;overflow:hidden}
.loader-bar-fill{height:100%;background:var(--gradient-saffron);border-radius:10px;animation:loaderBar 2s ease-in-out forwards}
@keyframes loaderPulse{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(255,107,0,.5)}50%{transform:scale(1.05);box-shadow:0 0 60px rgba(255,107,0,.8)}}
@keyframes loaderBar{0%{width:0}100%{width:100%}}
.top-gov-banner-wrapper{position:fixed;top:0;left:0;right:0;z-index:1050}
.top-gov-banner{height:28px;background:#020717;display:flex;justify-content:space-between;align-items:center;padding:0 5%;font-size:.72rem;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.08)}
.banner-left{display:flex;align-items:center;gap:8px}
.banner-left img{height:12px;width:auto;border-radius:1px}
#navbar{position:fixed;top:25px;left:0;right:0;z-index:1000;background:transparent;transition:var(--transition)}
#hero{min-height:100vh;background:var(--gradient-hero);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center;padding:180px 24px 80px}
.desktop-banner-text{display:inline}.mobile-banner-text{display:none}
@media(max-width:768px){.top-gov-banner{padding:8px 15px 5px;height:40px;position:relative;width:100%}.desktop-banner-text{display:none}.mobile-banner-text{display:inline}#navbar{top:40px;padding-top:10px}}
</style>

  <style>
    body {
      background: #f8fbff;
      color: var(--navy);
      overflow-x: hidden;
    }

    .optics-header {
      padding: 40px 24px 20px;
      text-align: center;
      position: relative;
      z-index: 10;
      background: var(--navy);
      color: white;
    }

    .optics-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .optics-header p {
      color: rgba(255,255,255,0.8);
      max-width: 600px;
      margin: 10px auto;
    }

    .back-btn {
      position: absolute;
      top: 90px;
      left: 24px;
      background: rgba(255,255,255,0.1);
      color: white;
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .back-btn:hover { background: var(--saffron); color: white; }

    .optics-app-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 30px;
      align-items: start;
    }

    .optics-viewer {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: auto;
      background: #fafcff;
      border: 1px solid #e0e6ed;
      border-radius: var(--radius-md);
    }

    .optics-panel {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 25px;
    }

    .optics-panel h3 {
      font-size: 1.25rem;
      color: var(--navy);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid rgba(13,27,42,0.1);
      padding-bottom: 10px;
    }

    .optics-panel h3 i {
      color: var(--saffron);
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .control-group label span.value {
      color: var(--saffron);
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--saffron);
    }

    .toggle-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #e0e6ed;
      background: #f8fbff;
      color: var(--text-medium);
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.3s;
    }

    .toggle-btn.active {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
      box-shadow: 0 4px 10px rgba(13,27,42,0.2);
    }

    .readout-box {
      background: #f1f5fa;
      border-radius: var(--radius-md);
      padding: 15px;
      margin-top: 30px;
    }

    .readout-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
      border-bottom: 1px dashed rgba(0,0,0,0.1);
      padding-bottom: 5px;
    }
    
    .readout-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .readout-item strong { color: var(--navy); }
    .readout-item span { font-family: monospace; font-size: 1rem; color: #E65100; font-weight: 600;}

    /* Mobile Responsive */
    @media (max-width: 900px) {
      .optics-app-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- <div id="header-placeholder"></div> -->



  <header class="optics-header">
    <a href="../study.html" onclick="if(document.referrer && document.referrer.includes('study.html')) { history.back(); return false; }" class="back-btn"><i class="fas fa-arrow-left"></i> <span>Back to Study Hub</span></a>
    <h1>Mirror Simulator</h1>
    <p>Explore light reflection, real and virtual images, and focal points using interactive ray tracing.</p>
  </header>

  <main>

  <section class="optics-app-container">
    <div class="optics-viewer">
      <canvas id="optics-canvas" width="800" height="500"></canvas>
    </div>

    <div class="optics-panel">
      <h3><i class="fas fa-sliders"></i> Simulation Controls</h3>
      

      <div class="toggle-group">
        <button class="toggle-btn active" id="btn-convex">Convex</button>
        <button class="toggle-btn" id="btn-concave">Concave</button>
      </div>

      <div class="control-group">
        <label><span>Focal Length (f)</span> <span><span class="value" id="val-focal">100</span> cm</span></label>
        <input type="range" id="range-focal" min="40" max="250" value="100" step="1">
      </div>

      <div class="control-group">
        <label><span>Object Distance (u)</span> <span><span class="value" id="val-dist">150</span> cm</span></label>
        <input type="range" id="range-dist" min="20" max="400" value="150" step="1">
      </div>

      <div class="control-group">
        <label><span>Object Height (h)</span> <span><span class="value" id="val-height">50</span> cm</span></label>
        <input type="range" id="range-height" min="10" max="150" value="50" step="1">
      </div>

      <div class="readout-box">
        <h3 style="border-bottom:none; margin-bottom:10px; font-size:1.1rem;"><i class="fas fa-calculator"></i> Results</h3>
        <div class="readout-item"><span>Image Distance (v)</span> <span><span id="res-v">0</span> cm</span></div>
        <div class="readout-item"><span>Magnification (m)</span> <span id="res-m">0</span></div>
        <div class="readout-item"><span>Image Height (h')</span> <span><span id="res-h">0</span> cm</span></div>
        <div class="readout-item"><span>Nature</span> <strong id="res-nature">Real</strong></div>
      </div>
    </div>
  </section>

  </main>

  <!-- <div id="footer-placeholder"></div> -->
  <script src="../js/main.js" defer></script>
  <script src="../js/mirror-simulator.js" defer></script>
</body>
</html>
