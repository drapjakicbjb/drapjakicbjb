  <style>
    /* Specific styles for Solar System */
    body {
      background: var(--dark-blue); /* Space background */
      color: white;
      overflow-x: hidden;
    }

    .solar-header {
      padding: 20px 24px 40px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .solar-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .solar-header p {
      color: rgba(255,255,255,0.8);
      max-width: 600px;
      margin: 10px auto;
    }

    .back-btn {
      position: absolute;
      top: 60px;
      left: 24px;
      background: rgba(255,255,255,0.1);
      color: white;
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .back-btn:hover {
      background: var(--saffron);
    }

    .solar-viewer {
      position: relative;
      width: 100vw;
      height: 800px; /* Space for orbits */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #solar-system-container {
      position: relative;
      width: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Rotate slightly for 3D effect */
      transform: rotateX(60deg);
      transform-style: preserve-3d;
    }

    .orbit-ring {
      position: absolute;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .orbit-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      animation: spin linear infinite;
    }

    .celestial-body {
      position: absolute;
      border-radius: 50%;
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%) rotateX(-60deg);
      cursor: pointer;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5);
      transition: box-shadow 0.2s ease;
      animation: anti-spin linear infinite;
    }
    
    .celestial-body:hover {
        z-index: 100;
        box-shadow: 0 0 20px rgba(255,255,255,0.8), inset -5px -5px 10px rgba(0,0,0,0.5);
    }

    .sun {
        transform: translate(-50%, -50%) rotateX(-60deg) !important;
        box-shadow: 0 0 50px #ffcc00, 0 0 100px #ff6600 !important;
        cursor: pointer;
        animation: none; /* Sun does not orbit */
    }

    /* Saturn's Rings */
    .saturn-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 180%;
        height: 180%;
        border: 4px solid rgba(210, 180, 140, 0.6);
        border-radius: 50%;
        transform: translate(-50%, -50%) rotateX(75deg);
        pointer-events: none;
    }

    @keyframes spin {
      100% { transform: translate(-50%, -50%) rotateZ(360deg); }
    }

    @keyframes anti-spin {
      0% { transform: translate(-50%, -50%) rotateZ(0deg) rotateX(-60deg); }
      100% { transform: translate(-50%, -50%) rotateZ(-360deg) rotateX(-60deg); }
    }

    /* Details Panel */
    .planet-panel {
      position: fixed;
      top: 0;
      right: -450px;
      width: 400px;
      height: 100vh;
      background: rgba(10, 20, 35, 0.98);
      backdrop-filter: blur(15px);
      border-left: 1px solid rgba(255,255,255,0.1);
      z-index: 10000;
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0;
      box-shadow: -10px 0 40px rgba(0,0,0,0.8);
      overflow-y: auto;
    }

    .planet-panel.active {
      right: 0;
    }

    .close-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      z-index: 10;
    }

    .close-panel:hover {
      color: var(--saffron);
      background: rgba(255,255,255,0.1);
      transform: rotate(90deg);
    }
    
    #details-content {
      padding: 0;
    }

    .details-header {
      padding: 30px 30px 20px;
      background: rgba(0,0,0,0.2);
    }

    .details-header h2 {
      font-size: 2.2rem;
      margin: 0;
      color: white;
      font-weight: 800;
      letter-spacing: 1px;
    }
    
    .real-planet-img {
      width: 100%;
      height: 300px;
      overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: black;
      position: relative;
    }
    
    .real-planet-img::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 -20px 20px -10px rgba(10, 20, 35, 1);
      pointer-events: none;
    }

    .real-planet-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.5s;
    }
    
    .real-planet-img:hover img {
      transform: scale(1.05);
    }

    .details-info {
      padding: 25px 30px;
      background: rgba(255,255,255,0.03);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.95rem;
    }
    
    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: rgba(255,255,255,0.6);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    
    .info-val {
      color: white;
      font-weight: 600;
      text-align: right;
    }

    .details-desc {
      padding: 0 30px 40px;
      line-height: 1.8;
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
    }
  </style>
</head>
