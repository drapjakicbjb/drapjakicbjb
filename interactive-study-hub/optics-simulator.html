<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) - Delayed Load for Performance -->
  <script>
    (function() {
      function loadGtag() {
        if (window.gtagLoaded) return;
        window.gtagLoaded = true;
        var script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-KG06S74784';
        script.async = true;
        document.head.appendChild(script);
        
        window.dataLayer = window.dataLayer || [];
        window.gtag = function() { dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-KG06S74784');
      }
      var timer = setTimeout(loadGtag, 3500);
      var triggerEvents = ['click', 'mousedown', 'keydown', 'touchstart', 'scroll'];
      triggerEvents.forEach(function(event) {
        window.addEventListener(event, function() {
          clearTimeout(timer);
          loadGtag();
        }, { once: true, passive: true });
      });
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Dr. A.P.J. Abdul Kalam Inter College - Optics Lens Simulator. Learn physics with our interactive ray tracing tool." />
  <title>Optics Simulator | Dr. A.P.J. Abdul Kalam Inter College</title>
  <link rel="icon" type="image/webp" href="../assets/images/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" /></noscript>
  <link rel="preload" href="../styles/fontawesome.min.css" as="style" />
  <link rel="stylesheet" href="../styles/fontawesome.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="preload" href="../styles/fontawesome.min.css" as="style" />
  <link rel="stylesheet" href="../styles/fontawesome.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="preload" href="../styles/fontawesome.min.css" as="style" />
  <link rel="stylesheet" href="../styles/fontawesome.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="../styles/fontawesome.min.css" /></noscript></noscript></noscript>
  <link rel="preload" href="../styles/main.min.css" as="style" />
  <link rel="stylesheet" href="../styles/main.min.css" />
  <style>
    body {
      background: #f8fbff;
      color: var(--navy);
      overflow-x: hidden;
    }

    .optics-header {
      padding: 40px 24px 20px;
      text-align: center;
      position: relative;
      z-index: 10;
      background: var(--navy);
      color: white;
    }

    .optics-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .optics-header p {
      color: rgba(255,255,255,0.8);
      max-width: 600px;
      margin: 10px auto;
    }

    .back-btn {
      position: absolute;
      top: 90px;
      left: 24px;
      background: rgba(255,255,255,0.1);
      color: white;
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .back-btn:hover { background: var(--saffron); color: white; }

    .optics-app-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 30px;
      align-items: start;
    }

    .optics-viewer {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: auto;
      background: #fafcff;
      border: 1px solid #e0e6ed;
      border-radius: var(--radius-md);
    }

    .optics-panel {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 25px;
    }

    .optics-panel h3 {
      font-size: 1.25rem;
      color: var(--navy);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid rgba(13,27,42,0.1);
      padding-bottom: 10px;
    }

    .optics-panel h3 i {
      color: var(--saffron);
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .control-group label span.value {
      color: var(--saffron);
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--saffron);
    }

    .toggle-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #e0e6ed;
      background: #f8fbff;
      color: var(--text-medium);
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.3s;
    }

    .toggle-btn.active {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
      box-shadow: 0 4px 10px rgba(13,27,42,0.2);
    }

    .readout-box {
      background: #f1f5fa;
      border-radius: var(--radius-md);
      padding: 15px;
      margin-top: 30px;
    }

    .readout-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
      border-bottom: 1px dashed rgba(0,0,0,0.1);
      padding-bottom: 5px;
    }
    
    .readout-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .readout-item strong { color: var(--navy); }
    .readout-item span { font-family: monospace; font-size: 1rem; color: #E65100; font-weight: 600;}

    /* Mobile Responsive */
    @media (max-width: 900px) {
      .optics-app-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- <div id="header-placeholder"></div> -->



  <header class="optics-header">
    <a href="../study.html" onclick="if(document.referrer && document.referrer.includes('study.html')) { history.back(); return false; }" class="back-btn"><i class="fas fa-arrow-left"></i> <span>Back to Study Hub</span></a>
    <h1>Optics Simulator</h1>
    <p>Explore light refraction, real and virtual images, and focal points using interactive ray tracing.</p>
  </header>

  <section class="optics-app-container">
    <div class="optics-viewer">
      <canvas id="optics-canvas" width="800" height="500"></canvas>
    </div>

    <div class="optics-panel">
      <h3><i class="fas fa-sliders"></i> Simulation Controls</h3>
      

      <div class="toggle-group">
        <button class="toggle-btn active" id="btn-convex">Convex</button>
        <button class="toggle-btn" id="btn-concave">Concave</button>
      </div>

      <div class="control-group">
        <label><span>Focal Length (f)</span> <span><span class="value" id="val-focal">100</span> cm</span></label>
        <input type="range" id="range-focal" min="40" max="250" value="100" step="1">
      </div>

      <div class="control-group">
        <label><span>Object Distance (u)</span> <span><span class="value" id="val-dist">150</span> cm</span></label>
        <input type="range" id="range-dist" min="20" max="400" value="150" step="1">
      </div>

      <div class="control-group">
        <label><span>Object Height (h)</span> <span><span class="value" id="val-height">50</span> cm</span></label>
        <input type="range" id="range-height" min="10" max="150" value="50" step="1">
      </div>

      <div class="readout-box">
        <h3 style="border-bottom:none; margin-bottom:10px; font-size:1.1rem;"><i class="fas fa-calculator"></i> Results</h3>
        <div class="readout-item"><span>Image Distance (v)</span> <span><span id="res-v">0</span> cm</span></div>
        <div class="readout-item"><span>Magnification (m)</span> <span id="res-m">0</span></div>
        <div class="readout-item"><span>Image Height (h')</span> <span><span id="res-h">0</span> cm</span></div>
        <div class="readout-item"><span>Nature</span> <strong id="res-nature">Real</strong></div>
      </div>
    </div>
  </section>
  <script src="../js/main.js" defer></script>
  <!-- <div id="footer-placeholder"></div> -->
  <script src="../js/main.js" defer></script>
  <script src="../js/optics-simulator.js" defer></script>
</body>
</html>
