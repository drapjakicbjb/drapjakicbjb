  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --saffron: #FF6B00;
      --saffron-light: #FF8C42;
      --green: #2E7D32;
      --dark-blue: #0D1B2A;
      --navy: #1A2744;
      --white: #FFF;
      --off-white: #F8FAFF;
      --text-dark: #1A202C;
      --gradient-hero: linear-gradient(135deg, #FF6B00 0%, #FF8C42 30%, #7CB342 70%, #2E7D32 100%);
      --gradient-saffron: linear-gradient(135deg, #FF6B00, #FF8C42);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .08);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --transition: all .3s cubic-bezier(.4, 0, .2, 1)
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      overflow-x: hidden;
      width: 100%;
      overflow-anchor: none
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--text-dark);
      background: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
      width: 100%;
      position: relative
    }

    img {
      max-width: 100%;
      height: auto;
      display: block
    }

    a {
      text-decoration: none;
      color: inherit
    }

    ul {
      list-style: none
    }

    #loader {
      position: fixed;
      inset: 0;
      background: var(--dark-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      transition: opacity .6s ease, visibility .6s ease
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden
    }

    .loader-logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      animation: loaderPulse 1.5s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(255, 107, 0, .5)
    }

    .loader-text {
      color: #fff;
      font-size: .85rem;
      letter-spacing: 3px;
      margin-top: 20px;
      text-transform: uppercase;
      opacity: .8
    }

    .loader-bar {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, .2);
      border-radius: 10px;
      margin-top: 16px;
      overflow: hidden
    }

    .loader-bar-fill {
      height: 100%;
      background: var(--gradient-saffron);
      border-radius: 10px;
      animation: loaderBar 2s ease-in-out forwards
    }

    @keyframes loaderPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 40px rgba(255, 107, 0, .5)
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 0 60px rgba(255, 107, 0, .8)
      }
    }

    @keyframes loaderBar {
      0% {
        width: 0
      }

      100% {
        width: 100%
      }
    }

    .top-gov-banner-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1050
    }

    .top-gov-banner {
      height: 28px;
      background: #020717;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      font-size: .72rem;
      color: rgba(255, 255, 255, .85);
      border-bottom: 1px solid rgba(255, 255, 255, .08)
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .banner-left img {
      height: 12px;
      width: auto;
      border-radius: 1px
    }

    #navbar {
      position: fixed;
      top: 25px;
      left: 0;
      right: 0;
      z-index: 1000;
      background: transparent;
      transition: var(--transition)
    }

    #hero {
      min-height: 100vh;
      background: var(--gradient-hero);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 180px 24px 80px
    }

    .desktop-banner-text {
      display: inline
    }

    .mobile-banner-text {
      display: none
    }

    @media(max-width:768px) {
      .top-gov-banner {
        padding: 8px 15px 5px;
        height: 40px;
        position: relative;
        width: 100%
      }

      .desktop-banner-text {
        display: none
      }

      .mobile-banner-text {
        display: inline
      }

      #navbar {
        top: 40px;
        padding-top: 10px
      }
    }
  </style>

  <style>
    body {
      background: #e8f5e9;
      color: var(--navy);
      overflow-x: hidden;
    }

    .sim-header {
      padding: 30px 24px 40px;
      text-align: center;
      position: relative;
      z-index: 10;
      background: #2e7d32;
      color: white;
    }

    .sim-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .sim-header p {
      color: rgba(255, 255, 255, 0.9);
      max-width: 600px;
      margin: 10px auto;
    }

    .back-btn {
      position: absolute;
      top: 70px;
      left: 24px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .back-btn:hover {
      background: white;
      color: #2e7d32;
    }

    .sim-app-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 30px;
      align-items: start;
    }

    .sim-viewer {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      text-align: center;
    }

    canvas {
      width: 100%;
      max-width: 600px;
      height: auto;
      background: #fafcff;
      border-radius: var(--radius-md);
      cursor: crosshair;
    }

    .sim-panel {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 25px;
    }

    .sim-panel h3 {
      font-size: 1.25rem;
      color: #2e7d32;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid rgba(46, 125, 50, 0.1);
      padding-bottom: 10px;
    }

    .info-box {
      background: #f1f8e9;
      border-radius: var(--radius-md);
      padding: 20px;
      border-left: 4px solid #2e7d32;
      min-height: 200px;
    }

    .info-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1b5e20;
      margin-bottom: 10px;
    }

    .info-desc {
      font-size: 1rem;
      color: #333;
      line-height: 1.6;
    }

    .toggle-group {
      display: flex;
      background: #e8f5e9;
      border-radius: 50px;
      padding: 5px;
      margin-bottom: 25px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px 15px;
      border: none;
      background: transparent;
      color: #2e7d32;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
    }

    .toggle-btn:hover {
      background: rgba(46, 125, 50, 0.1);
    }

    .toggle-btn.active {
      background: #2e7d32;
      color: white;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
    }

    @media (max-width: 900px) {
      .sim-app-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <header class="sim-header">
    <a href="/study"
      onclick="if(document.referrer && (document.referrer.includes('study.html') || document.referrer.includes('study'))) { history.back(); return false; }"
      class="back-btn"><i class="fas fa-arrow-left"></i> <span>Back to Study Hub</span></a>
    <h1>Interactive Animal Cell</h1>
    <p>Hover over and click organelles to learn about their functions.</p>
  </header>

  <main>

    <section class="sim-app-container">
      <div class="sim-viewer">
        <canvas id="bio-canvas" width="600" height="600"></canvas>
      </div>

      <div class="sim-panel">
        <h3 style="border-bottom:none; padding-bottom:5px; margin-bottom:10px;"><i class="fas fa-sliders"></i> Cell Type
        </h3>
        <div class="toggle-group" style="margin-bottom: 25px;">
          <button class="toggle-btn active" id="btn-animal">Animal Cell</button>
          <button class="toggle-btn" id="btn-plant">Plant Cell</button>
        </div>

        <h3><i class="fas fa-microscope"></i> Organelle Information</h3>

        <div class="info-box">
          <div class="info-title" id="info-title">Select an Organelle</div>
          <div class="info-desc" id="info-desc">Click on parts of the cell diagram to view details here.</div>
        </div>
      </div>
    </section>

  </main>
